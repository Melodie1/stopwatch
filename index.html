<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>Stopwatch</title>
    <style>
        body { font-family: Arial, sans-serif; background: #181f1c; color: #a5aa52; padding: 40px; }
        .container {max-width:190px; justify-content: center; background: #274029; gap:30px;padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(155, 0, 0, 0.1); margin: auto; }
        h2 { text-align: center; color: #9ea93f; }
        h1 { text-align: center; color: #e5ef89; }
        .cont2 { max-width: 500px; background: #181F1C; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(155, 0, 0, 0.1); margin: auto; }
        h4 {text-align:center; color: #a5aa52; }
        label { display: block; margin-top: 15px; font-weight: bold; display: inline; }
        input, select { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #6E859F; border-radius: 4px; box-sizing: border-box; }
        button {justify-content: center; background: #370926; color: #a5aa52; border: none; padding: 12px; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:hover { background: #42113c; }
        .stopwatch-display {
            display: flex;
            justify-content: center;
            align-items: baseline;
            margin-top: 20px;
            gap:10px;
        }
    </style>
</head>
<body>
    <h1>Stopwatch</h1>
    <div class="stopwatch-display">
        <h1 id="hr">00</h1>
        <h4> hrs </h4>
        <h1 id="min">00</h1>
        <h4> mins </h4>
        <h1 id="sec">00</h1>
        <h4> secs </h4>
        <h1 id="ms">000</h1>
    </div>
    <div class="container">
        <button id="start" onclick="start_timer(event)">Start</button>
        <button id="stop"  onclick="stop_timer(event)">Stop</button>
        <button id="reset"  onclick="reset_timer(event)">Reset</button>
    </div>
    <script src="script.js"></script>
</body>
